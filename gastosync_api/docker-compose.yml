services:
  postgres:
    image: postgres:16-alpine
    container_name: gastosync_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gastosync
      POSTGRES_PASSWORD: gastosync_secret
      POSTGRES_DB: gastosync_db
    ports:
      - "5432:5432"
    volumes:
      - gastosync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastosync -d gastosync_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  gastosync_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gastosync_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gastosync_pgdata:
